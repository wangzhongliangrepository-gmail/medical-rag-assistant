<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>医疗知识助手</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; flex-direction: column; height: 100vh;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f5f7fa; color: #1a2b3c;
    }
    .wrap { max-width: 800px; margin: 0 auto; width: 100%; }

    /* 顶栏（固定，不滚动）*/
    header { border-bottom: 1px solid #e6ebf1; background: #fff; padding: 10px 24px; }
    .hbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .title { font-size: 17px; font-weight: 600; }
    .hctrl { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6b7a8d; }
    .uid-input {
      width: 130px; padding: 5px 8px; font-size: 13px; border: 1px solid #cfd8e3;
      border-radius: 7px; outline: none;
    }
    .uid-input:focus { border-color: #2b7de9; }
    .hbtn {
      font-size: 13px; padding: 5px 10px; background: #fff; color: #2b7de9;
      border: 1px solid #cfd8e3; border-radius: 7px; cursor: pointer;
    }
    .hbtn:hover { background: #eef4fe; }

    /* 消息区（唯一滚动区）*/
    #chat { flex: 1; overflow-y: auto; padding: 22px 24px; }
    .turn { margin-bottom: 16px; }
    .turn::after { content: ""; display: table; clear: both; }
    .bubble-user {
      background: #2b7de9; color: #fff; padding: 10px 14px; border-radius: 12px 12px 2px 12px;
      display: inline-block; max-width: 85%; float: right; clear: both; font-size: 15px;
    }
    .bubble-bot {
      background: #fff; border: 1px solid #e3e9f0; padding: 12px 16px; border-radius: 12px 12px 12px 2px;
      max-width: 95%; float: left; clear: both;
    }
    .answer { white-space: pre-wrap; line-height: 1.7; font-size: 15px; }
    .answer strong { color: #11233a; }
    .understood { font-size: 12px; color: #8a97a8; margin-bottom: 6px; }
    .reflect-note { font-size: 12px; color: #1aa86a; margin: 6px 0 2px; }
    .mode { font-size: 12px; color: #6b7a8d; margin: 8px 0 4px; }
    .src-toggle { font-size: 12px; color: #2b7de9; cursor: pointer; margin-top: 8px; user-select: none; }
    .src-list { margin-top: 8px; }
    .src { font-size: 13px; padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; background: #f7f9fc; }
    .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; margin-right: 6px; color: #fff; }
    .tag-in { background: #2b7de9; }
    .tag-ex { background: #1aa86a; }
    .src-text { color: #5a6b7e; margin-top: 4px; }
    .sys-note { text-align: center; color: #9aa7b6; font-size: 12.5px; margin: 10px 0; }
    .loading { color: #6b7a8d; }

    /* 输入区（固定底部，不随对话下移）*/
    .composer { padding: 0 24px 10px; }
    .composer-box {
      max-width: 800px; margin: 0 auto; background: #fff; border: 1px solid #cfd8e3;
      border-radius: 16px; padding: 10px 12px 8px; box-shadow: 0 2px 12px rgba(20,40,80,.05);
    }
    .composer-box:focus-within { border-color: #2b7de9; }
    #q {
      width: 100%; border: none; outline: none; resize: none; font-size: 15px;
      line-height: 1.5; max-height: 160px; font-family: inherit; color: #1a2b3c;
      background: transparent;
    }
    .composer-bar { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
    .left, .right { display: flex; align-items: center; gap: 8px; }

    /* + 按钮 + 菜单（左下，含联网开关）*/
    .plus-wrap, .model-wrap { position: relative; }
    .plus {
      width: 32px; height: 32px; border-radius: 8px; border: 1px solid #cfd8e3;
      background: #fff; cursor: pointer; font-size: 18px; color: #46586d; line-height: 1;
    }
    .plus:hover { background: #f2f6fb; }
    .plus-menu, .model-menu {
      position: absolute; bottom: 40px; background: #fff; border: 1px solid #cfd8e3;
      border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.12); padding: 6px;
      display: none; z-index: 20; min-width: 220px;
    }
    .plus-menu { left: 0; }
    .model-menu { right: 0; }
    .plus-menu.open, .model-menu.open { display: block; }
    .menu-toggle { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 14px; cursor: pointer; border-radius: 7px; }
    .menu-toggle:hover { background: #f2f6fb; }
    .menu-toggle input { width: 16px; height: 16px; }

    /* 模型胶囊（右下）*/
    .model-pill {
      display: inline-flex; align-items: center; gap: 5px; background: #fff; color: #34465c;
      font-size: 13px; padding: 6px 10px; border-radius: 16px; cursor: pointer; border: 1px solid #cfd8e3;
    }
    .model-pill:hover { background: #f2f6fb; }
    .model-pill .tier { color: #9aa7b6; }
    .model-pill .caret { color: #9aa7b6; font-size: 11px; }
    .model-item { padding: 9px 12px; cursor: pointer; font-size: 14px; color: #1a2b3c; border-radius: 7px; }
    .model-item:hover { background: #eef4fe; }
    .model-item.active { background: #f0f6ff; }
    .model-item .desc { font-size: 12px; color: #8a97a8; margin-top: 2px; }

    .send {
      width: 34px; height: 34px; border-radius: 9px; border: none; background: #2b7de9;
      color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .send:hover { background: #1f6fd6; }
    .send:disabled { background: #9bb8e0; cursor: not-allowed; }
    .send svg { display: block; }
    .disclaimer { text-align: center; color: #b06b00; font-size: 11.5px; margin: 6px 0 0; }
  </style>
</head>
<body>
  <header>
    <div class="wrap hbar">
      <div class="title">🩺 医疗知识助手</div>
      <div class="hctrl">
        <span>用户ID</span>
        <input id="uid-input" class="uid-input" title="改成不同 ID 可测试长期记忆隔离" />
        <button class="hbtn" onclick="applyUid()">切换</button>
        <button class="hbtn" onclick="newChat()">🆕 新会话</button>
      </div>
    </div>
  </header>

  <div id="chat"></div>

  <div class="composer">
    <div class="composer-box">
      <textarea id="q" rows="1" placeholder="输入医疗问题…（Enter 发送，Shift+Enter 换行）"></textarea>
      <div class="composer-bar">
        <div class="left">
          <div class="plus-wrap">
            <button class="plus" onclick="togglePlus(event)" title="更多选项">+</button>
            <div class="plus-menu" id="plus-menu">
              <label class="menu-toggle">
                <input type="checkbox" id="web" />
                🌐 联网搜索（融合外部 Web，更慢）
              </label>
            </div>
          </div>
        </div>
        <div class="right">
          <div class="model-wrap">
            <button class="model-pill" onclick="toggleModelMenu(event)">
              <span id="model-name">DeepSeek Flash</span>
              <span class="tier" id="model-tier">快</span>
              <span class="caret">⌄</span>
            </button>
            <div class="model-menu" id="model-menu">
              <div class="model-item" data-model="flash" onclick="selectModel('flash')">
                DeepSeek Flash<div class="desc">日常问答（默认）</div>
              </div>
              <div class="model-item" data-model="pro" onclick="selectModel('pro')">
                DeepSeek Pro<div class="desc">更强推理，复杂 / 疑难问题</div>
              </div>
            </div>
          </div>
          <button class="send" id="ask" onclick="ask()" title="发送" aria-label="发送">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="20" x2="12" y2="5"></line>
              <polyline points="6 11 12 5 18 11"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div class="disclaimer">⚠️ 本回答仅供学习演示，非医疗建议；如有健康问题请咨询专业医师。</div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    function uuid() { return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()); }

    // user_id：长期记忆身份（可手动改，测隔离）；session_id：会话/短期记忆 thread
    let USER_ID = localStorage.getItem("med_user_id") || ("user-" + uuid().slice(0, 4));
    localStorage.setItem("med_user_id", USER_ID);
    let SESSION_ID = localStorage.getItem("med_session_id") || uuid();
    localStorage.setItem("med_session_id", SESSION_ID);
    $("uid-input").value = USER_ID;

    function sysNote(text) {
      const d = document.createElement("div");
      d.className = "sys-note"; d.textContent = text;
      $("chat").appendChild(d); d.scrollIntoView({ block: "end" });
    }

    function newChat() {
      SESSION_ID = uuid(); localStorage.setItem("med_session_id", SESSION_ID);
      $("chat").innerHTML = "";
      sysNote("新会话开始（用户 " + USER_ID + "）｜ 长期记忆按用户ID保留，短期对话已清空");
      $("q").focus();
    }

    function applyUid() {
      const v = $("uid-input").value.trim();
      if (!v) { $("uid-input").value = USER_ID; return; }
      if (v === USER_ID) return;
      USER_ID = v; localStorage.setItem("med_user_id", v);
      SESSION_ID = uuid(); localStorage.setItem("med_session_id", SESSION_ID);
      $("chat").innerHTML = "";
      sysNote("已切换用户：" + v + "｜将读取该用户的长期记忆（换 ID 即换身份，可测记忆隔离）");
      $("q").focus();
    }

    // 模型选择
    let MODEL = localStorage.getItem("med_model") || "flash";
    function renderModel() {
      $("model-name").textContent = MODEL === "pro" ? "DeepSeek Pro" : "DeepSeek Flash";
      $("model-tier").textContent = MODEL === "pro" ? "强" : "快";
      document.querySelectorAll(".model-item").forEach((el) =>
        el.classList.toggle("active", el.dataset.model === MODEL));
    }
    function closeMenus() { $("model-menu").classList.remove("open"); $("plus-menu").classList.remove("open"); }
    function toggleModelMenu(e) { e.stopPropagation(); const o = $("model-menu").classList.contains("open"); closeMenus(); if (!o) $("model-menu").classList.add("open"); }
    function togglePlus(e) { e.stopPropagation(); const o = $("plus-menu").classList.contains("open"); closeMenus(); if (!o) $("plus-menu").classList.add("open"); }
    function selectModel(m) { MODEL = m; localStorage.setItem("med_model", m); renderModel(); closeMenus(); }
    document.addEventListener("click", closeMenus);
    $("plus-menu").addEventListener("click", (e) => e.stopPropagation());  // 菜单内点击不关闭
    renderModel();

    function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function md(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }

    function addUserBubble(text) {
      const div = document.createElement("div");
      div.className = "turn";
      div.innerHTML = '<div class="bubble-user">' + esc(text) + '</div>';
      $("chat").appendChild(div); div.scrollIntoView({ behavior: "smooth", block: "end" });
    }
    function addBotBubble(html) {
      const div = document.createElement("div");
      div.className = "turn";
      div.innerHTML = '<div class="bubble-bot">' + html + '</div>';
      $("chat").appendChild(div); div.scrollIntoView({ behavior: "smooth", block: "end" });
      return div;
    }

    function renderAnswer(q, d, useWeb) {
      let html = "";
      if (d.standalone_question && d.standalone_question !== q) {
        html += '<div class="understood">理解为：' + esc(d.standalone_question) + '</div>';
      }
      html += '<div class="answer">' + md(d.answer) + '</div>';
      if (d.revisions && d.revisions > 1) {
        html += '<div class="reflect-note">🔁 经过 ' + d.revisions + ' 轮证据反思核验（补检索后重答）</div>';
      }
      html += '<div class="mode">模式：' + (useWeb ? '内部教材 + 联网 Web' : '仅内部教材')
            + ' ｜ 内部 ' + d.n_internal + ' 段，外部 ' + d.n_external + ' 条 → 重排取 ' + d.evidence.length + '</div>';
      if (d.evidence && d.evidence.length) {
        const sid = "src-" + Date.now();
        html += '<div class="src-toggle" onclick="var x=document.getElementById(\'' + sid + '\');x.style.display=(x.style.display===\'none\'?\'block\':\'none\')">▾ 查看来源（' + d.evidence.length + '）</div>';
        html += '<div class="src-list" id="' + sid + '" style="display:none">';
        d.evidence.forEach((e, i) => {
          const isExt = e.source.startsWith("外部");
          const tag = isExt ? '<span class="tag tag-ex">外部</span>' : '<span class="tag tag-in">内部</span>';
          const name = e.source.replace(/^内部·|^外部·/, "");
          html += '<div class="src">' + tag + '[' + (i + 1) + '] ' + esc(name) + ' (score ' + e.score + ')'
                + '<div class="src-text">' + esc(e.text) + '…</div></div>';
        });
        html += '</div>';
      }
      return html;
    }

    async function ask() {
      const q = $("q").value.trim();
      if (!q) return;
      const useWeb = $("web").checked;
      $("ask").disabled = true;
      $("q").value = ""; $("q").style.height = "auto";
      addUserBubble(q);
      const loading = addBotBubble('<div class="loading">检索中…' + (useWeb ? '（含联网，稍慢）' : '') + '</div>');
      try {
        const resp = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q, use_external: useWeb, session_id: SESSION_ID, user_id: USER_ID, model: MODEL }),
        });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const d = await resp.json();
        loading.querySelector(".bubble-bot").innerHTML = renderAnswer(q, d, useWeb);
        loading.scrollIntoView({ behavior: "smooth", block: "end" });
      } catch (e) {
        loading.querySelector(".bubble-bot").innerHTML = '<div style="color:#c0392b">出错了：' + esc(e.message) + '</div>';
      } finally {
        $("ask").disabled = false; $("q").focus();
      }
    }

    // textarea：自动增高 + Enter 发送 / Shift+Enter 换行
    $("q").addEventListener("input", function () {
      this.style.height = "auto"; this.style.height = Math.min(this.scrollHeight, 160) + "px";
    });
    $("q").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
    });

    sysNote("输入医疗问题开始对话。改顶部「用户ID」可切换身份、测试长期记忆隔离。");
  </script>
</body>
</html>
